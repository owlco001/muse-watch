plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claws4u.musewatch'
    compileSdk 34

    defaultConfig {
        applicationId "com.claws4u.musewatch"
        minSdk 27
        targetSdk 34
        versionCode 10
        versionName "2.4"
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:157.0.20261005135250"
}
